  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0\" stroke-width=\"3\"><\u002Fcircle><path d=\"M12 26 C14 12 50 12 52 26 C44 22 20 22 12 26 Z\" fill=\"var(--accent,#FF6B4A)\" stroke=\"#2B2320\" stroke-width=\"3\"><\u002Fpath><circle cx=\"25\" cy=\"34\" r=\"3.4\" fill=\"#2B2320\"><\u002Fcircle><circle cx=\"39\" cy=\"34\" r=\"3.4\" fill=\"#2B2320\"><\u002Fcircle><path d=\"M27 43 Q32 46.5 37 43\" stroke=\"#2B2320\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"width:54px;height:54px;background:#C9D9E6;border:2.5px solid #2B2320;border-radius:12px;box-shadow:0 3.5px 0 rgba(43,35,32,.22);display:grid;place-items:center;transform:rotate(3deg);font:700 30px Fredoka,sans-serif;color:#2B2320\">D<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-width:0\">\n    <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font:600 25px Fredoka,sans-serif;color:#2B2320\">Paper Theater<\u002Fspan><span style=\"font:700 10.5px 'Space Mono',monospace;color:#FFFBF2;background:#2B2320;padding:3px 8px;border-radius:5px;letter-spacing:.08em\">RECOMMENDED<\u002Fspan><\u002Fdiv>\n    <div style=\"font:400 12.5px/1.55 'Space Mono',monospace;color:#6E6255;margin-top:7px;max-width:640px\">Every level is a toy diorama cut from construction paper on a small stage. The craft material IS the rulebook: paper tears, board is permanent, foil kills. Working title “PLOD” — the creatures are plods.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:26px 36px 8px\">\n  <div style=\"font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:#8A8072\">01 · WHY THIS DIRECTION<\u002Fdiv>\n  <div style=\"display:flex;gap:18px;margin-top:14px\">\n    <div style=\"flex:1;background:#FFF9EC;border:1.5px solid rgba(43,35,32,.14);border-radius:12px;padding:16px 18px\">\n      <div style=\"font:600 15px Fredoka,sans-serif;color:#2B2320\">Material = rules<\u002Fdiv>\n      <div style=\"font:400 13px/1.5 Fredoka,sans-serif;color:#4A4038;margin-top:6px\">Paper tears (destructible), slate board never does (permanent), glossy foil kills (hazard). Players read the physics from craft materials — no legend needed.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#FFF9EC;border:1.5px solid rgba(43,35,32,.14);border-radius:12px;padding:16px 18px\">\n      <div style=\"font:600 15px Fredoka,sans-serif;color:#2B2320\">Silhouette first<\u002Fdiv>\n      <div style=\"font:400 13px/1.5 Fredoka,sans-serif;color:#4A4038;margin-top:6px\">Every plod carries a 2.5px ink outline and a cast shadow; skills change the <em>outline<\u002Fem> (hat, canopy, arms), so states read at 24px, on any terrain, for any color vision.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:#FFF9EC;border:1.5px solid rgba(43,35,32,.14);border-radius:12px;padding:16px 18px\">\n      <div style=\"font:600 15px Fredoka,sans-serif;color:#2B2320\">Warm toys, cool signals<\u002Fdiv>\n      <div style=\"font:400 13px/1.5 Fredoka,sans-serif;color:#4A4038;margin-top:6px\">The world is warm paper. Signal Blue belongs to the interface only — selection and cursor — so nothing in a level ever competes with UI meaning.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:26px 36px 8px\">\n  <div style=\"font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:#8A8072\">02 · PALETTE<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:13px;margin-top:14px\">\n    <div style=\"display:flex;gap:12px;align-items:flex-start\"><div style=\"width:104px;flex:none;font:700 10px 'Space Mono',monospace;color:#8A8072;letter-spacing:.1em;padding-top:16px\">BACKDROP<\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#C9D9E6\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Sugar Sky<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#C9D9E6<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#F6EFE2\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Cloud Cream<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#F6EFE2<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:flex-start\"><div style=\"width:104px;flex:none;font:700 10px 'Space Mono',monospace;color:#8A8072;letter-spacing:.1em;padding-top:16px\">TERRAIN · TEARS<\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#C89D63\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Kraft<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#C89D63 · earth<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#E3C08A\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Fresh Tear<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#E3C08A · new cuts<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#6E4E36\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Cocoa<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#6E4E36 · depth<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#7E9C58\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Moss<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#7E9C58 · safe top<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:flex-start\"><div style=\"width:104px;flex:none;font:700 10px 'Space Mono',monospace;color:#8A8072;letter-spacing:.1em;padding-top:16px\">PERMANENT<\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#7A8494\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Slate Board<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#7A8494 · steel<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:flex-start\"><div style=\"width:104px;flex:none;font:700 10px 'Space Mono',monospace;color:#8A8072;letter-spacing:.1em;padding-top:16px\">HAZARD<\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:linear-gradient(180deg,#E8459A,#A21D5E)\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Foil Magenta<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#D6337F · deadly<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:repeating-linear-gradient(45deg,#F2B23E 0 7px,#2B2320 7px 14px)\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Caution Tape<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#F2B23E + ink<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:flex-start\"><div style=\"width:104px;flex:none;font:700 10px 'Space Mono',monospace;color:#8A8072;letter-spacing:.1em;padding-top:16px\">CREATURES<\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#FFF6E5\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Marshmallow<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#FFF6E5 · body<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:var(--accent,#FF6B4A)\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Hood Coral<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#FF6B4A · tweakable<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:flex-start\"><div style=\"width:104px;flex:none;font:700 10px 'Space Mono',monospace;color:#8A8072;letter-spacing:.1em;padding-top:16px\">INK &amp; UI<\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#2B2320\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Board Ink<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#2B2320 · line+text<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#FFFBF2\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Paper White<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#FFFBF2 · UI tiles<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:104px\"><div style=\"height:46px;border-radius:8px;border:1.5px solid rgba(43,35,32,.25);background:#2E7CD6\"><\u002Fdiv><div style=\"font:600 12.5px Fredoka,sans-serif;color:#2B2320;margin-top:5px\">Signal Blue<\u002Fdiv><div style=\"font:400 10.5px 'Space Mono',monospace;color:#8A8072\">#2E7CD6 · UI only<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font:400 11px/1.6 'Space Mono',monospace;color:#8A8072;margin-top:14px\">Ink on Paper White 13:1 · numerals on Ink chips 12:1 · figure/ground never relies on fill contrast — the outline + shadow guarantee separation · Signal Blue never appears in terrain art.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:26px 36px 8px\">\n  <div style=\"font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:#8A8072\">03 · FIGURE / GROUND — one plod on every surface<\u002Fdiv>\n  <div style=\"display:flex;gap:12px;margin-top:14px\">\n    <div style=\"width:104px\"><div style=\"height:92px;border-radius:10px;border:2px solid rgba(43,35,32,.18);background:#C9D9E6;display:grid;place-items:center\"><svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px 'Space Mono',monospace;color:#8A8072;text-align:center;margin-top:5px\">sky<\u002Fdiv><\u002Fdiv>\n    <div style=\"width:104px\"><div style=\"height:92px;border-radius:10px;border:2px solid rgba(43,35,32,.18);background:#C89D63;display:grid;place-items:center\"><svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px 'Space Mono',monospace;color:#8A8072;text-align:center;margin-top:5px\">kraft<\u002Fdiv><\u002Fdiv>\n    <div style=\"width:104px\"><div style=\"height:92px;border-radius:10px;border:2px solid rgba(43,35,32,.18);background:#7E9C58;display:grid;place-items:center\"><svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px 'Space Mono',monospace;color:#8A8072;text-align:center;margin-top:5px\">moss<\u002Fdiv><\u002Fdiv>\n    <div style=\"width:104px\"><div style=\"height:92px;border-radius:10px;border:2px solid rgba(43,35,32,.18);background:#6E4E36;display:grid;place-items:center\"><svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px 'Space Mono',monospace;color:#8A8072;text-align:center;margin-top:5px\">cocoa<\u002Fdiv><\u002Fdiv>\n    <div style=\"width:104px\"><div style=\"height:92px;border-radius:10px;border:2px solid rgba(43,35,32,.18);background:#7A8494;display:grid;place-items:center\"><svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px 'Space Mono',monospace;color:#8A8072;text-align:center;margin-top:5px\">slate<\u002Fdiv><\u002Fdiv>\n    <div style=\"width:104px\"><div style=\"height:92px;border-radius:10px;border:2px solid rgba(43,35,32,.18);background:linear-gradient(180deg,#E8459A,#A21D5E);display:grid;place-items:center\"><svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px 'Space Mono',monospace;color:#8A8072;text-align:center;margin-top:5px\">foil<\u002Fdiv><\u002Fdiv>\n    <div style=\"width:104px\"><div style=\"height:92px;border-radius:10px;border:2px solid rgba(43,35,32,.18);background:#2B2320;display:grid;place-items:center\"><svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px 'Space Mono',monospace;color:#8A8072;text-align:center;margin-top:5px\">ink<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:26px 36px 8px\">\n  <div style=\"font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:#8A8072\">04 · THE PLOD &amp; ITS EIGHT JOBS<\u002Fdiv>\n  <div style=\"display:flex;gap:26px;margin-top:14px;align-items:center;background:#FFF9EC;border:1.5px solid rgba(43,35,32,.14);border-radius:12px;padding:18px 22px\">\n    <svg width=\"150\" height=\"150\" sc-camel-view-box=\"0 0 64 64\" style=\"flex:none\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px 26px;font:400 12px/1.5 'Space Mono',monospace;color:#4A4038\">\n      <div><b style=\"color:#2B2320\">BODY<\u002Fb> — one marshmallow mass, no limbs to track<\u002Fdiv>\n      <div><b style=\"color:#2B2320\">HOOD<\u002Fb> — accent cap is the “skill slot”: gear swaps here<\u002Fdiv>\n      <div><b style=\"color:#2B2320\">OUTLINE<\u002Fb> — 2.5px board ink on every piece, always<\u002Fdiv>\n      <div><b style=\"color:#2B2320\">SHADOW<\u002Fb> — soft cast ellipse lifts figure off any paper<\u002Fdiv>\n      <div><b style=\"color:#2B2320\">FACE<\u002Fb> — two dots + smile; only the bomber panics<\u002Fdiv>\n      <div><b style=\"color:#2B2320\">ACCENT<\u002Fb> — Hood Coral is tweakable (see Tweaks panel)<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px\">\n    <div style=\"border:1.5px solid rgba(43,35,32,.14);border-radius:12px;padding:14px;background:#FFFDF6\"><div style=\"display:flex;justify-content:center;padding:6px 0 2px\"><svg width=\"92\" height=\"92\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:8px;justify-content:center\"><span style=\"font:600 15px Fredoka,sans-serif;color:#2B2320\">Walker<\u002Fspan><\u002Fdiv><div style=\"font:400 10.5px/1.5 'Space Mono',monospace;color:#8A8072;text-align:center;margin-top:3px\">cap + stride — the neutral read<\u002Fdiv><div style=\"display:flex;gap:14px;align-items:center;justify-content:center;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(43,35,32,.18)\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><g><\u002Fg><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 64 64\" style=\"filter:brightness(0) opacity(.85)\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><span style=\"font:400 9px 'Space Mono',monospace;color:#B0A694\">24px · silhouette<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1.5px solid rgba(43,35,32,.14);border-
