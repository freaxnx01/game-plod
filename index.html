document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rder:2px solid #2B2320;border-radius:10px;box-shadow:0 3px 0 rgba(43,35,32,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;overflow:hidden;cursor:pointer\" style-hover=\"transform:translateY(-3px)\" sc-camel-on-click=\"{{ nuke }}\"><span style=\"{{ nukeStripeStyle }}\"><\u002Fspan><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" style=\"position:relative\"><use href=\"#i-bomb\"><\u002Fuse><\u002Fsvg><span style=\"{{ nukeLabelStyle }}\">{{ nukeLabel }}<\u002Fspan><\u002Fdiv>\n  <span style=\"flex:1\"><\u002Fspan>\n  <div style=\"width:196px;height:74px;background:#2B2320;border:2px solid #2B2320;border-radius:10px;overflow:hidden\"><canvas id=\"plod-mm\" ref=\"{{ mm }}\" width=\"192\" height=\"70\" style=\"display:block\"><\u002Fcanvas><\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showOverlay }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;background:rgba(43,35,32,.38);display:grid;place-items:center;z-index:5\">\n<div style=\"background:#FFFBF2;border:3px solid #2B2320;border-radius:18px;box-shadow:0 10px 0 rgba(43,35,32,.28);padding:34px 44px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:kfade .3s ease-out both;max-width:560px\">\n  <sc-if value=\"{{ showReady }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;gap:7px\">\n      <div style=\"width:46px;height:46px;background:#C89D63;border:2.5px solid #2B2320;border-radius:10px;box-shadow:0 3px 0 rgba(43,35,32,.22);display:grid;place-items:center;transform:rotate(-3deg);font:700 26px Fredoka,sans-serif;color:#2B2320\">P<\u002Fdiv>\n      <div style=\"width:46px;height:46px;background:#7E9C58;border:2.5px solid #2B2320;border-radius:10px;box-shadow:0 3px 0 rgba(43,35,32,.22);display:grid;place-items:center;transform:rotate(2deg);font:700 26px Fredoka,sans-serif;color:#FFFBF2\">L<\u002Fdiv>\n      <div style=\"width:46px;height:46px;background:#FFF6E5;border:2.5px solid #2B2320;border-radius:10px;box-shadow:0 3px 0 rgba(43,35,32,.22);display:grid;place-items:center;transform:rotate(-2deg)\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"width:46px;height:46px;background:var(--accent,#FF6B4A);border:2.5px solid #2B2320;border-radius:10px;box-shadow:0 3px 0 rgba(43,35,32,.22);display:grid;place-items:center;transform:rotate(3deg);font:700 26px Fredoka,sans-serif;color:#FFFBF2\">D<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:600 24px Fredoka,sans-serif;color:#2B2320;text-align:center\">Guide {{ quota }} of {{ total }} plods home<\u002Fdiv>\n    <div style=\"font:400 12px/1.7 'Space Mono',monospace;color:#6E6255;text-align:center\">They march out of the hatch and never stop.<br>Pick a skill, click a plod. Paper tears · slate doesn’t · foil kills.<\u002Fdiv>\n    <div style=\"display:flex;gap:14px;font:400 10.5px 'Space Mono',monospace;color:#8A8072\"><span>1–8 skills<\u002Fspan><span>SPACE pause<\u002Fspan><span>N nuke ×2<\u002Fspan><span>R restart<\u002Fspan><\u002Fdiv>\n    <div style=\"width:250px;height:66px;background:#FFFBF2;border:3px solid #2E7CD6;border-radius:14px;box-shadow:0 6px 0 rgba(43,35,32,.24);display:grid;place-items:center;font:600 23px Fredoka,sans-serif;color:#2B2320;cursor:pointer;animation:kpulse 1.6s ease-in-out infinite\" sc-camel-on-click=\"{{ startGame }}\">PLAY<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showPaused }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"font:600 24px Fredoka,sans-serif;color:#2B2320\">PAUSED<\u002Fdiv>\n    <div style=\"font:400 11.5px 'Space Mono',monospace;color:#8A8072\">{{ statLine }}<\u002Fdiv>\n    <div style=\"display:flex;gap:12px\">\n      <div style=\"width:180px;height:58px;background:#FFFBF2;border:3px solid #2E7CD6;border-radius:13px;box-shadow:0 5px 0 rgba(43,35,32,.24);display:grid;place-items:center;font:600 19px Fredoka,sans-serif;color:#2B2320;cursor:pointer\" sc-camel-on-click=\"{{ togglePause }}\">RESUME<\u002Fdiv>\n      <div style=\"width:180px;height:58px;background:#FFFBF2;border:2.5px solid #2B2320;border-radius:13px;box-shadow:0 4px 0 rgba(43,35,32,.2);display:grid;place-items:center;font:600 19px Fredoka,sans-serif;color:#2B2320;cursor:pointer\" sc-camel-on-click=\"{{ restart }}\">RESTART<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showWon }}\" hint-placeholder-val=\"{{ false }}\">\n    <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 64 64\"><use href=\"#s-walker\"><\u002Fuse><\u002Fsvg>\n    <div style=\"font:600 26px Fredoka,sans-serif;color:#2B2320\">ALL TUCKED IN<\u002Fdiv>\n    <div style=\"font:400 12px 'Space Mono',monospace;color:#6E6255\">{{ statLine }}<\u002Fdiv>\n    <div style=\"width:220px;height:60px;background:#FFFBF2;border:3px solid #2E7CD6;border-radius:13px;box-shadow:0 5px 0 rgba(43,35,32,.24);display:grid;place-items:center;font:600 20px Fredoka,sans-serif;color:#2B2320;cursor:pointer\" sc-camel-on-click=\"{{ restart }}\">PLAY AGAIN<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showLost }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"font:600 26px Fredoka,sans-serif;color:#2B2320\">TOO FEW MADE IT<\u002Fdiv>\n    <div style=\"font:400 12px 'Space Mono',monospace;color:#6E6255\">{{ statLine }}<\u002Fdiv>\n    <div style=\"width:220px;height:60px;background:#FFFBF2;border:3px solid #2E7CD6;border-radius:13px;box-shadow:0 5px 0 rgba(43,35,32,.24);display:grid;place-items:center;font:600 20px Fredoka,sans-serif;color:#2B2320;cursor:pointer\" sc-camel-on-click=\"{{ restart }}\">TRY AGAIN<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:1360px;max-width:94vw;display:flex;gap:14px;margin-top:12px;font:400 10.5px 'Space Mono',monospace;color:#8A8072\"><span>hotkeys 1–8<\u002Fspan><span>SPACE pause<\u002Fspan><span>N nuke (press twice)<\u002Fspan><span>R restart<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span>accent · total plods · hitboxes in Tweaks<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FF6B4A&quot;, &quot;options&quot;: [&quot;#FF6B4A&quot;, &quot;#4E86E8&quot;, &quot;#9A64D8&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Creatures&quot;}, &quot;totalPlods&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 20, &quot;min&quot;: 10, &quot;max&quot;: 40, &quot;step&quot;: 5, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Level&quot;}, &quot;debugHitboxes&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Debug&quot;}}\">\nclass Component extends DCLogic {\n  state = { phase: \"ready\", out: 0, home: 0, deaths: 0, timerStr: \"6:00\", amber: false, flow: 25, speed: 1, selected: null, counts: null, nukeArm: false, scale: 1 };\n  cv = React.createRef();\n  mm = React.createRef();\n\n  SKILLS = [\n    { key: \"climber\", label: \"CLIMBER\", icon: \"#i-climb\", n: 4, hk: \"1\" },\n    { key: \"floater\", label: \"FLOATER\", icon: \"#i-float\", n: 4, hk: \"2\" },\n    { key: \"bomber\", label: \"BOMBER\", icon: \"#i-bomb\", n: 4, hk: \"3\" },\n    { key: \"blocker\", label: \"BLOCKER\", icon: \"#i-block\", n: 4, hk: \"4\" },\n    { key: \"builder\", label: \"BUILDER\", icon: \"#i-build\", n: 10, hk: \"5\" },\n    { key: \"basher\", label: \"BASHER\", icon: \"#i-bash\", n: 4, hk: \"6\" },\n    { key: \"miner\", label: \"MINER\", icon: \"#i-mine\", n: 4, hk: \"7\" },\n    { key: \"digger\", label: \"DIGGER\", icon: \"#i-dig\", n: 6, hk: \"8\" }\n  ];\n  W = 1360; H = 727; QUOTA_FRAC = 0.5; TIME = 360; MAX_FALL = 250;\n  HATCH = { x: 180, y: 216 }; EXIT = { x: 1180, y: 470 };\n\n  accent() { return this.
